# Docker Compose for All-At-Once Code Clone Detection

services:
  monitorTool:
    image: monitor-tool
    depends_on:
      - dbstorage
    ports:
      - 8081:3000
    volumes:
      - ./Containers/MonitorTool:/usr/src/app
      - /usr/src/app/node_modules
      - session-archive:/data
    environment:
      DBHOST: dbstorage
      ARCHIVE_PATH: /data/previous-session.json
    mem_limit: 256m

  clone-detector:
    image: cljdetector
    command: clear
    depends_on:
      monitorTool:
        condition: service_started
      dbstorage:
        condition: service_started
    ports:
      - 8080:3000
    volumes:
      - ./Containers/cljdetector:/usr/src/app
      - qc-volume:/QualitasCorpus
    environment:
      DBHOST: dbstorage
      SOURCEDIRtest: "/usr/src/app/test/data"
      SOURCEDIReclipse: "/QualitasCorpus/QualitasCorpus-20130901r/Systems/eclipse_SDK"
      SOURCEDIR: "/QualitasCorpus"
      CHUNKSIZE: 20
    mem_limit: 2g

  dbstorage:
    image: mongo
    restart: always
    command: --quiet --syslog --wiredTigerCacheSizeGB 2
    ports:
      - 27017:27017
    expose:
      - "27017"
    volumes:
      - dbstorage:/data/db
      - dbconfig:/data/configdb
    mem_limit: 3g

volumes:
  dbstorage:
  dbconfig:
  qc-volume:
    external: true
  session-archive:
